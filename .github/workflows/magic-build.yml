name: magic-build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GO_VERSION: "1.25.4"
  FLUTTER_VERSION: "3.47.9"
  TARGET_REPO: vip-svip/gopeed
  TAG: magic-v1.0.0

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 预装 SDK 的 runner 无需 setup-android（其默认安装已下线的 tools 包会失败）
      - name: Show Android SDK
        run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # 编译前静态测试：只把 error 当失败，warning/info 不阻断
      - name: Static analysis (fail on errors)
        working-directory: ui/flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build gomobile aar
        run: |
          # gomobile init 内部硬编码 `go install .../gobind@latest`，
          # 而 x/mobile 最新版本 go 指令要求 1.26，因此显式指定可下载的 1.26 工具链。
          export GOTOOLCHAIN=go1.26.11
          go env GOTOOLCHAIN
          XM=v0.0.0-20251126181937-5c265dc024c4
          # gobind 在目标模块内解析 golang.org/x/mobile/bind，必须先显式引入依赖
          go get golang.org/x/mobile/bind@$XM
          go install golang.org/x/mobile/cmd/gomobile@$XM
          go install golang.org/x/mobile/cmd/gobind@$XM
          export PATH="$PATH:$(go env GOPATH)/bin"
          which gomobile gobind
          gomobile init || true
          mkdir -p ui/flutter/android/app/libs
          gomobile bind -tags nosqlite -ldflags="-w -s -checklinkname=0" \
            -o ui/flutter/android/app/libs/libgopeed.aar \
            -target=android -androidapi 21 -javapkg="com.gopeed" \
            github.com/GopeedLab/gopeed/bind/mobile
          git checkout -- go.mod go.sum || true
          ls -la ui/flutter/android/app/libs/

      - name: Build APK
        working-directory: ui/flutter
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define="UPDATE_CHANNEL=android"

      - name: Collect
        run: |
          mkdir -p out
          find ui/flutter/build/app/outputs -name "*.apk" -exec cp {} out/Gopeed-magic-arm64.apk \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error

  module:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dl/apk

      - name: Pack module
        run: |
          chmod +x .github/scripts/pack-module.sh
          APK=$(find dl/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          .github/scripts/pack-module.sh "$APK" out

      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: out/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    # Windows 构建失败不阻断交付（APK 与模块是主交付物）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force -Path ui/flutter/assets/exec | Out-Null
          go build -tags nosqlite -ldflags="-w -s" -buildmode=c-shared -o ui/flutter/windows/libgopeed.dll github.com/GopeedLab/gopeed/bind/desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host.exe github.com/GopeedLab/gopeed/cmd/host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater.exe github.com/GopeedLab/gopeed/cmd/updater
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cd ui/flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter build windows --dart-define="UPDATE_CHANNEL=windowsPortable"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $release = "build\windows\x64\runner\Release\"
          $system = "C:\Windows\System32"
          $cc = (Get-Command -Name (go env CC) -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          foreach ($dll in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")) {
              $runtimePath = [string](& $cc "-print-file-name=$dll")
              if ($runtimePath -eq $dll) { $runtimePath = Join-Path (Split-Path -Parent $cc) $dll }
              if (Test-Path -LiteralPath $runtimePath -PathType Leaf) {
                  Copy-Item -LiteralPath $runtimePath -Destination $release -Force
              }
          }
          foreach ($d in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
              Copy-Item -LiteralPath (Join-Path $system $d) -Destination $release -ErrorAction SilentlyContinue
          }
          New-Item -Path build\windows\Output -ItemType Directory -Force | Out-Null
          Compress-Archive -Path "$release*" -DestinationPath "build\windows\Output\Gopeed-magic-windows-amd64-portable.zip" -Force
          Get-ChildItem build\windows\Output

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ui/flutter/build/windows/Output/*.zip
          if-no-files-found: error

  publish:
    needs: [android, module, windows]
    if: always() && needs.android.result == 'success' && needs.module.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: module
          path: out

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows
          path: out

      - name: Checksums
        run: |
          cd out
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ env.TARGET_REPO }}
          TAG: ${{ env.TAG }}
        run: |
          chmod +x .github/scripts/publish.sh
          .github/scripts/publish.sh
